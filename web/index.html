<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>יוֹנָה א — Jonah 1</title>
<style>
  :root {
    --bg: #faf8f3;
    --ink: #1c1c1e;
    --accent: #b5651d;
    --panel: #ffffff;
    --muted: #6b6b70;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px;
    background: rgba(250,248,243,0.9); backdrop-filter: blur(8px);
    border-bottom: 1px solid #e7e3da;
  }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; }
  #play {
    border: none; background: none; cursor: pointer;
    font-size: 30px; line-height: 1; color: var(--accent);
    width: 44px; height: 44px;
  }
  main { max-width: 760px; margin: 0 auto; padding: 24px 20px 80px; }
  .verse {
    direction: rtl; text-align: right;
    display: flex; flex-wrap: wrap; align-items: flex-start;
    gap: 6px 10px; margin-bottom: 26px;
    line-height: 2.6;
  }
  .vnum {
    font-size: 13px; color: var(--muted);
    align-self: flex-start; margin-top: 10px;
  }
  .word {
    position: relative;
    font-size: 34px;
    padding: 2px 4px; border-radius: 6px;
    cursor: pointer; user-select: none; -webkit-user-select: none;
    touch-action: none;
    transition: background-color .12s ease, color .12s ease;
  }
  .word.active { color: var(--accent); background: rgba(181,101,29,0.12); }
  .word .anno {
    position: absolute; left: 50%; transform: translateX(-50%);
    direction: ltr; text-align: center;
    width: 170px; font-size: 12px; line-height: 1.3;
    background: var(--panel); color: var(--ink);
    border: 1px solid #e7e3da; border-radius: 8px;
    padding: 5px 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    pointer-events: none; opacity: 0; display: none; z-index: 5;
  }
  .word.active .anno { opacity: 1; display: block; }
  .word .gloss { bottom: calc(100% + 6px); font-weight: 600; }
  .word .grammar { top: calc(100% + 6px); color: var(--muted); }
  .hint {
    text-align: center; color: var(--muted); font-size: 13px;
    direction: ltr; margin: 0 0 18px;
  }
</style>
</head>
<body>
  <header>
    <h1>יוֹנָה א</h1>
    <button id="play" title="Play / Pause" aria-label="Play or pause">▶︎</button>
  </header>
  <main>
    <p class="hint">Hold a word to stop the audio and see its meaning; release to play from that word.</p>
    <div id="text"></div>
  </main>

  <audio id="audio" preload="auto" src="jonah1.wav"></audio>

  <script src="data.js"></script>
  <script src="word_times.js"></script>
  <script>
    const words = window.JONAH || [];
    const textEl = document.getElementById("text");
    const audio = document.getElementById("audio");
    const playBtn = document.getElementById("play");

    // Build verses
    const verses = [];
    for (const w of words) {
      let v = verses[verses.length - 1];
      if (!v || v.n !== w.verse) { v = { n: w.verse, words: [] }; verses.push(v); }
      v.words.push(w);
    }

    // Per-word start times produced by neural forced alignment
    // (torchaudio MMS_FA model, generated offline into word_times.js).
    const WORD_TIMES = window.WORD_TIMES || [];
    function wordStartTime(i) {
      const t = WORD_TIMES[i];
      return t ? t.begin : 0;
    }

    let wordIndex = 0;
    for (const v of verses) {
      const row = document.createElement("div");
      row.className = "verse";
      const num = document.createElement("span");
      num.className = "vnum";
      num.textContent = v.n;
      row.appendChild(num);
      for (const w of v.words) {
        const el = document.createElement("span");
        el.className = "word";
        el.textContent = w.heb;
        const gloss = document.createElement("span");
        gloss.className = "anno gloss";
        gloss.textContent = w.gloss;
        const grammar = document.createElement("span");
        grammar.className = "anno grammar";
        grammar.textContent = w.parseFull;
        el.appendChild(gloss);
        el.appendChild(grammar);
        attachHold(el, wordIndex);
        wordIndex++;
        row.appendChild(el);
      }
      textEl.appendChild(row);
    }

    // Play / pause
    playBtn.addEventListener("click", () => {
      if (audio.paused) audio.play(); else audio.pause();
    });
    audio.addEventListener("play", () => (playBtn.textContent = "❚❚"));
    audio.addEventListener("pause", () => (playBtn.textContent = "▶︎"));

    // Hold behavior: touching a word stops the audio and shows its gloss and
    // grammar; releasing hides the annotation and resumes playback from the
    // start of that word. (Seeking while paused is accurate; seeking while
    // playing would drift ahead by about a word.)
    let active = null;
    let pendingIndex = -1;

    function begin(el, i) {
      if (active) active.classList.remove("active");
      active = el;
      pendingIndex = i;
      el.classList.add("active");
      audio.pause();
    }

    function release(play) {
      if (!active) return;
      active.classList.remove("active");
      active = null;
      if (!play) { pendingIndex = -1; return; }
      const i = pendingIndex;
      pendingIndex = -1;
      const seek = () => { audio.currentTime = wordStartTime(i); audio.play(); };
      if (isFinite(audio.duration) && audio.duration > 0) {
        seek();
      } else {
        // Duration not known yet: load metadata, then seek once.
        audio.addEventListener("loadedmetadata", seek, { once: true });
        audio.load();
      }
    }

    function attachHold(el, i) {
      el.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        el.setPointerCapture?.(e.pointerId);
        begin(el, i);
      });
      el.addEventListener("pointerup", (e) => { e.preventDefault(); release(true); });
      el.addEventListener("pointercancel", () => release(false));
      el.addEventListener("lostpointercapture", () => release(false));
    }
  </script>
</body>
</html>
